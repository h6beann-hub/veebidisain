<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>

    body {
        background-color: #0a0a0a;
        color: #ff4fd8;
        font-family: "Courier New", monospace;
        margin: 50px;
        max-width: 800px;
    }

    h1 {
        font-size: 48px;
        text-transform: uppercase;
        border-bottom: 3px solid #ff4fd8;
        padding-bottom: 15px;
    }

    p {
        color: #eeeeee;
        font-size: 18px;
        line-height: 1.6;
    }

    input[type="number"] {
        background-color: #0a0a0a;
        color: #39ff88;
        border: 2px solid #39ff88;
        padding: 10px;
        font-family: "Courier New", monospace;
        font-size: 18px;
        margin-top: 8px;
    }

    input[type="button"] {
        background-color: #ff4fd8;
        color: #000000;
        border: 2px solid #ff4fd8;
        padding: 12px 20px;
        font-family: "Courier New", monospace;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
    }

    input[type="button"]:hover {
        background-color: #39ff88;
        border-color: #39ff88;
    }

    #vastus {
        color: #39ff88;
        margin-top: 30px;
        padding: 20px;
        border: 2px solid #39ff88;
    }

    a {
        color: #ff4fd8;
    }

    hr {
        border: none;
        border-top: 1px solid #ff4fd8;
        margin-top: 40px;
    }

</style>
    <title>Küberfeminismi kalkulaator</title>

    <script>
        function arvuta() {

            let tunnid = Number(document.getElementById("tunnid").value);
            let platvormid = Number(document.getElementById("platvormid").value);

            let tulemus = 30 + (tunnid * 5) + (platvormid * 4);

            if (tulemus > 100) {
                tulemus = 100;
            }

            let teade = "";

            if (tulemus <= 30) {
                teade = "SYSTEM OFFLINE. REVOLUTION NOT FOUND.";
            }
            else if (tulemus <= 50) {
                teade = "CONSCIOUSNESS.EXE IS BOOTING...";
            }
            else if (tulemus <= 70) {
                teade = "ALGORITHM RESISTANCE DETECTED.";
            }
            else if (tulemus <= 89) {
                teade = "PATRIARCHY.EXE HAS STOPPED WORKING.";
            }
            else {
                teade = "CYBERFEMINIST REVOLUTION ACTIVATED.";
            }

            document.getElementById("vastus").innerHTML =
                "Sinu küberfeminismi tase on " + tulemus + "%<br><br>" + teade;
        }
    </script>

</head>

<body>

    <h1>Küberfeminismi kalkulaator_</h1>

    <p>
        sest ilmselgelt saab feminismi mõõta protsentides.
    </p>

    <p>
        mitu tundi päevas veedad substackis?
        <br>
        <input type="number" id="tunnid">
    </p>

    <p>
        mitu raamatut sa sellel aastal lugenud oled?
        <br>
        <input type="number" id="platvormid">
    </p>

    <input type="button" value="ANALÜÜSI MIND" onclick="arvuta()">

    <h2 id="vastus"></h2>

    <hr>

    <p>
        <a href="index.html">← tagasi sisukorda</a>
    </p>

</body>

</html>
