<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>küberfeminismi kalkulaator</title>

    <style>

        body {
            background-color: #0a0a0a;
            color: #0066ff;
            font-family: "Courier New", monospace;
            margin: 50px;
            max-width: 800px;
            min-height: 100vh;
        }

        body::before {
            content: "✦ CYBERFEMINIST NETWORK // EST. 2026 ✦";
            display: block;
            color: #bdbdbd;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            text-transform: uppercase;
            border-bottom: 3px solid #0066ff;
            padding-bottom: 15px;
            letter-spacing: -2px;
        }

        p {
            color: #eeeeee;
            font-size: 18px;
            line-height: 1.6;
        }

        input[type="number"] {
            background-color: #0a0a0a;
            color: #0066ff;
            border: 2px solid #0066ff;
            padding: 10px;
            font-family: "Courier New", monospace;
            font-size: 18px;
            margin-top: 8px;
            width: 220px;
        }

        input[type="button"] {
            background-color: #0066ff;
            color: #000000;
            border: 2px solid #0066ff;
            padding: 12px 20px;
            font-family: "Courier New", monospace;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 5px 5px 0 #bdbdbd;
        }

        input[type="button"]:hover {
            background-color: #c0c0c0;
            border-color: #c0c0c0;
        }

        input[type="button"]:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 #bdbdbd;
        }

        #vastus {
            color: #0066ff;
            margin-top: 30px;
        }

        #vastus:not(:empty) {
            padding: 20px;
            border: 2px solid #0066ff;
        }

        a {
            color: #0066ff;
        }

        hr {
            border: none;
            border-top: 1px solid #0066ff;
            margin-top: 40px;
        }

        /* leopardimustriga dekoratiivne riba */

body::after {
    content: "";
    position: fixed;
    top: 0;
    right: 0;
    width: 28%;
    height: 100vh;

    background-color: #c0c0c0;

    background-image:
        radial-gradient(ellipse at 20% 20%,
            #0a0a0a 0%,
            #0a0a0a 12%,
            #0066ff 13%,
            #0066ff 22%,
            transparent 23%),

        radial-gradient(ellipse at 70% 40%,
            #0a0a0a 0%,
            #0a0a0a 10%,
            #0066ff 11%,
            #0066ff 20%,
            transparent 21%),

        radial-gradient(ellipse at 35% 75%,
            #0a0a0a 0%,
            #0a0a0a 11%,
            #0066ff 12%,
            #0066ff 21%,
            transparent 22%),

        radial-gradient(ellipse at 85% 85%,
            #0a0a0a 0%,
            #0a0a0a 9%,
            #0066ff 10%,
            #0066ff 18%,
            transparent 19%);

    background-size: 130px 130px;

    border-left: 3px solid #0066ff;

    z-index: -1;
}

    </style>

    <script>

        function arvuta() {

            let tunnid = Number(document.getElementById("tunnid").value);
            let platvormid = Number(document.getElementById("platvormid").value);

            let tulemus = 30 + (tunnid * 5) + (platvormid * 4);

            if (tulemus > 100) {
                tulemus = 100;
            }

            let teade = "";

            if (tulemus <= 30) {
                teade = "SYSTEM OFFLINE. REVOLUTION NOT FOUND.";
            }
            else if (tulemus <= 50) {
                teade = "CONSCIOUSNESS.EXE IS BOOTING...";
            }
            else if (tulemus <= 70) {
                teade = "ALGORITHM RESISTANCE DETECTED.";
            }
            else if (tulemus <= 89) {
                teade = "PATRIARCHY.EXE HAS STOPPED WORKING.";
            }
            else {
                teade = "CYBERFEMINIST REVOLUTION ACTIVATED.";
            }

            document.getElementById("vastus").innerHTML =
                "Sinu küberfeminismi tase on " + tulemus + "%<br><br>" + teade;
        }

    </script>

</head>

<body>

    <h1>küberfeminismi kalkulaator_</h1>

    <p>
        sest ilmselgelt saab feminismi mõõta protsentides.
    </p>

    <p>
        mitu tundi päevas veedad substackis?
        <br>
        <input type="number" id="tunnid">
    </p>

    <p>
        mitu raamatut sa sellel aastal lugenud oled?
        <br>
        <input type="number" id="platvormid">
    </p>

    <input type="button" value="ANALÜÜSI MIND" onclick="arvuta()">

    <h2 id="vastus"></h2>

    <hr>

    <p>
        <a href="index.html">← tagasi sisukorda</a>
    </p>

</body>

</html>
