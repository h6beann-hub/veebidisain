<!doctype html>
<html>
  <head>
     <script>
        function kysi(){ 
           let lause=`
             SELECT ?item ?itemLabel
              WHERE
              {
                ?item wdt:P27 wd:${riik.value}. 
                ?item wdt:P106 wd:${amet.value}.
              
                SERVICE wikibase:label {
                  bd:serviceParam wikibase:language "[AUTO_LANGUAGE],mul,en".
                } 
              }
              LIMIT 10
           `;
            let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURIComponent(lause); 
          vastus.innerHTML="ootan vastust";
         fetch(aadress)
  .then(d => {
    if (!d.ok) throw new Error("HTTP viga: " + d.status);
    return d.json();
  })
  .then(kuva)
  .catch(viga => {
    console.error(viga);
    vastus.innerHTML = "<li>Päring ebaõnnestus: " + viga.message + "</li>";
  });
        }


       
        function kuva(d){
           console.log(d);
           vastus.innerHTML="";
           for(let rida of d["results"]["bindings"]){
              console.log(rida["itemLabel"]["value"]);
              let lause=document.createElement("li");
              lause.textContent=rida["itemLabel"]["value"];
              vastus.appendChild(lause);
           }
        }
     </script>
  </head>
  <body>
     <select id="riik" onchange="kysi()">
        <option value="Q33">Soome</option>
        <option value="Q191">Eesti</option>
        <option value="Q34">Rootsi</option>
     </select>
    <select id="amet" onchange="kysi()">

    <option value="Q177220">Laulja</option>

    <option value="Q49757">Luuletaja</option>

    <option value="Q483501">Kunstnik</option>

    <option value="Q33999">Näitleja</option>

</select>
     <input type="button" value="otsi" onclick="kysi()" />
 
     <ul id="vastus"></ul>
  </body>
</html>
