
<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Koolid ja ametid – Wikidata</title>

    <script>
        function kysi() {
            let riik = document.getElementById("riik").value;
            let amet = document.getElementById("amet").value;
            let vastus = document.getElementById("vastus");

            let lause = `
                SELECT ?kool ?koolLabel ?kogus
                WHERE {
                    {
                        SELECT ?kool
                               (COUNT(DISTINCT ?isik) AS ?kogus)
                        WHERE {
                            ?isik wdt:P27 wd:${riik}.
                            ?isik wdt:P106 wd:${amet}.
                            ?isik wdt:P69 ?kool.
                        }
                        GROUP BY ?kool
                    }

                    SERVICE wikibase:label {
                        bd:serviceParam wikibase:language "et,en".
                    }
                }
                ORDER BY DESC(?kogus)
                LIMIT 10
            `;

            let aadress =
                "https://query.wikidata.org/sparql?format=json&query="
                + encodeURIComponent(lause);

            vastus.innerHTML = "<li>Ootan vastust...</li>";

            fetch(aadress)
                .then(d => {
                    if (!d.ok) {
                        throw new Error("HTTP viga: " + d.status);
                    }
                    return d.json();
                })
                .then(kuva)
                .catch(viga => {
                    console.error(viga);
                    vastus.innerHTML =
                        "<li>Päring ebaõnnestus: "
                        + viga.message + "</li>";
                });
        }

        function kuva(d) {
            let vastus = document.getElementById("vastus");
            vastus.innerHTML = "";

            let tulemused = d.results.bindings;

            if (tulemused.length === 0) {
                vastus.innerHTML =
                    "<li>Tulemusi ei leitud.</li>";
                return;
            }

            for (let rida of tulemused) {
                let element = document.createElement("li");

                let kool = rida.koolLabel.value;
                let kogus = rida.kogus.value;

                element.textContent =
                    kool + " – " + kogus + " inimest";

                vastus.appendChild(element);
            }
        }
    </script>
</head>

<body>
    <h2>Millistes koolides on erinevate ametite esindajad õppinud?</h2>

    <label for="riik">Riik:</label>
    <select id="riik" onchange="kysi()">
        <option value="Q33">Soome</option>
        <option value="Q191">Eesti</option>
        <option value="Q34">Rootsi</option>
    </select>

    <label for="amet">Amet:</label>
    <select id="amet" onchange="kysi()">
        <option value="Q193391">Diplomaat</option>
        <option value="Q333634">Tõlkija</option>
        <option value="Q201788">Ajaloolane</option>
        <option value="Q82955">Poliitik</option>
    </select>

    <input type="button" value="Otsi" onclick="kysi()">

    <h3>Tulemused</h3>
    <ul id="vastus"></ul>
</body>
</html>
