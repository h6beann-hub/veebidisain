<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Minu kaart</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #kaardikiht {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>

<div id="kaardikiht"></div>

<script>
    var kaart = L.map('kaardikiht').setView([59.437, 24.753], 12);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(kaart);
</script>

</body>
</html>
