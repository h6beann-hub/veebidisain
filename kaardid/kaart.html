<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Minu Tallinna hangout spotid</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #kaardikiht {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>

<div id="kaardikiht"></div>

<script>

    // Loome Tallinna kaardi
    var kaart = L.map('kaardikiht').setView([59.445, 24.72], 13);

    // Lisame OpenStreetMapi taustakaardi
    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(kaart);


    // Loeme kohad eraldi kohad.json failist
    fetch("kohad.json")
        .then(vastus => vastus.json())
        .then(kuvaKohad);


    // Teeme iga koha jaoks markeri
    function kuvaKohad(kohad) {

        for (let koht of kohad) {

            L.marker([koht.lat, koht.lon])
                .addTo(kaart)
                .bindPopup(
                    "<b>" + koht.nimi + "</b><br>" +
                    koht.kirjeldus
                );

        }
    }

</script>

</body>

</html>
