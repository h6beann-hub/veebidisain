<!DOCTYPE html>
<html>
<head>
    <title>Minu kaart</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />

    <style>
        body {
            padding: 0;
            margin: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        #kaardikiht {
            width: 100%;
            height: 100%;
        }
    </style>

    <script>
        var kaart;

        function algus() {

            kaart = L.map('kaardikiht').setView([59.437, 24.753], 12);

            new L.TileLayer(
                'https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA',
                {
                    attribution: "Map: Maa-amet",
                    tms: true
                }
            ).addTo(kaart);

        }
    </script>
</head>

<body onload="algus()">

    <div id="kaardikiht"></div>

</body>
</html>
