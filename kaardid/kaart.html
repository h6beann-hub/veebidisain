<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Cool Hangout Spots</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Pealkiri */
        #pealkiri {
            height: 70px;
            background-color: #ffd6e7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        /* Kaart */
        #kaardikiht {
            height: calc(100% - 70px);
            width: 100%;
        }

        /* Beebiroosa marker */
        .roosa-marker {
            background-color: #f5a9c4;
            width: 22px;
            height: 22px;
            border-radius: 50% 50% 50% 0;
            border: 2px solid white;
            transform: rotate(-45deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

    </style>
</head>

<body>

    <div id="pealkiri">
        cool hangout spots
    </div>

    <div id="kaardikiht"></div>

    <script>

        // Loome Tallinna kaardi
        var kaart = L.map('kaardikiht').setView([59.445, 24.72], 13);

        // OpenStreetMapi taust
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(kaart);


        // Loome enda roosa markeri
        var roosaIkoon = L.divIcon({
            className: '',
            html: '<div class="roosa-marker"></div>',
            iconSize: [26, 26],
            iconAnchor: [13, 26],
            popupAnchor: [0, -26]
        });


        // Loeme kohad.json faili
        fetch("kohad.json")
            .then(vastus => vastus.json())
            .then(kuvaKohad);


        // Lisame iga koha kaardile
        function kuvaKohad(kohad) {

            for (let koht of kohad) {

                L.marker(
                    [koht.lat, koht.lon],
                    {icon: roosaIkoon}
                )
                .addTo(kaart)
                .bindPopup(
                    "<b>" + koht.nimi + "</b><br>" +
                    koht.kirjeldus
                );

            }
        }

    </script>

</body>

</html>
