
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Cool Hangout Spots</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
  let kaart;
  let hypik;
  let marker1, marker2;
  function algus () {
  kaart = L.map('kaardikiht').setView([59.439,24.773], 12);
  L.titleLayer( 'https://maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA' , {
  attribution: "Map: <a href='http://www.maaamet.ee/'>Maa-amet</a>a>",
  tms: true,
  }).addTo(kaart);
  marker1=L.marker([59.439,24.773], {draggable: true});
  marker2=L.marker([59.439,24.773], {draggable: true});
  marker1.addTo(kaart);
  marker2.addTo(kaart);
  marker1.on("dragend", liikumine);
  marker2.on("dragend", liikumine);
  hypik=L.popup();
  kaart.on("click", vajutus);

  }
  function liikumine (){
   selgitus.innerText=marker1.getLatLng().distanceTo(marker2.getLatLng());
  }

  function kuvaTee(andmed){
  tee=andmed.routes[0];
  console.log(tee["duration"], tee["distance"]);
  console.log(tee["geometry"]);
  L.geoJSON(tee.geometry).addTo(kaart);
  }
    </script>


    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Pealkiri */
        #pealkiri {
            height: 70px;
            background-color: #ffd6e7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        /* Kaart */
        #kaardikiht {
            height: calc(100% - 70px);
            width: 100%;
        }

        /* Beebiroosa marker */
        .roosa-marker {
            background-color: #f5a9c4;
            width: 22px;
            height: 22px;
            border-radius: 50% 50% 50% 0;
            border: 2px solid white;
            transform: rotate(-45deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

    </style>
</head>

<body>

    <div id="pealkiri">
        cool hangout spots
    </div>

    <div id="kaardikiht"></div>

    <script>

        // Loome Tallinna kaardi
       kaart = L.map('kaardikiht').setView([59.445, 24.72], 13);

        // OpenStreetMapi taust
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(kaart);


        // Loome enda roosa markeri
        var roosaIkoon = L.divIcon({
            className: '',
            html: '<div class="roosa-marker"></div>',
            iconSize: [26, 26],
            iconAnchor: [13, 26],
            popupAnchor: [0, -26]
        });


        // Loeme kohad.json faili
        fetch("kohad.json")
            .then(vastus => vastus.json())
            .then(kuvaKohad);


        // Lisame iga koha kaardile
        function kuvaKohad(kohad) {

            for (let koht of kohad) {

                L.marker(
                    [koht.lat, koht.lon],
                    {icon: roosaIkoon}
                )
                .addTo(kaart)
                .bindPopup(
                    "<b>" + koht.nimi + "</b><br>" +
                    koht.kirjeldus
                );

            }
        }

    </script>

</body>

</html>
