<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Tallinna teatrid</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #pealkiri {
            height: 70px;
            background-color: #ffd6e7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        #kaardikiht {
            height: calc(100% - 70px);
            width: 100%;
        }
    </style>
</head>

<body>

    <div id="pealkiri">
        Tallinna teatrid
    </div>

    <div id="kaardikiht"></div>

    <script>

        let kaart = L.map('kaardikiht').setView([59.437, 24.745], 14);

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(kaart);

    </script>

</body>

</html>
