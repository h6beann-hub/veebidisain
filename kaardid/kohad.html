<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Tallinna teatrid</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

     #pealkiri {
    height: 70px;
    background-color: #ffd6e7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    position: relative;
}

#lisaNupp {
    position: absolute;
    right: 25px;
    background-color: white;
    color: black;
    padding: 10px 16px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 15px;
    font-weight: normal;
}

#lisaNupp:hover {
    background-color: #fff0f6;
}

        #kaardikiht {
            height: calc(100% - 70px);
            width: 100%;
        }
    </style>
</head>

<body>

    <div id="pealkiri">
    <span>Tallinna teatrid</span>

    <a id="lisaNupp"
       href="https://docs.google.com/forms/d/e/1FAIpQLSelnSV7S4sr8lu93WRbOUSioprPhCZbMQL31BL1lvv8_uYGJQ/viewform?usp=dialog"
       target="_blank">
        + lisa uus teater
    </a>
</div>

    <div id="kaardikiht"></div>

    <script>

        // Siia salvestame Google Sheetsist saadud teatrid
        let teatridAndmed = [];

        // Siia salvestame kasutaja valitud asukoha markeri
        let kasutajaMarker;


        // Loome kaardi
        let kaart = L.map('kaardikiht').setView([59.437, 24.745], 14);


        // Lisame OpenStreetMapi tausta
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(kaart);


        // Google Apps Scripti aadress
        let tabeliURL =
        "https://script.google.com/macros/s/AKfycbyZVUNwouV3-LXpfEsal4dfVxC9eBJ-RuOjvz1XO5vobRk1c5njstfRPvfP-YheEX-O/exec";


        // Küsime teatrid Google Sheetsist
        fetch(tabeliURL)
            .then(vastus => vastus.json())
            .then(kuvaTeatrid);


        // Näitame Google Sheetsist saadud teatrid kaardil
        function kuvaTeatrid(teatrid) {

            console.log(teatrid);

            teatridAndmed = teatrid;

            for (let teater of teatrid) {

                L.marker([
                    Number(teater.laiuskraad),
                    Number(teater.pikkuskraad)
                ])
                .addTo(kaart)
                .bindPopup(
                    "<b>" + teater.teater + "</b><br>" +
                    teater.aadress
                );
            }
        }


        // Kui kasutaja vajutab kaardile
        kaart.on("click", function(e) {

            // Eemaldame eelmise kasutaja markeri
            if (kasutajaMarker) {
                kaart.removeLayer(kasutajaMarker);
            }


            // Popupi tekst
            let tekst =
                "<b>Sinu valitud asukoht</b><br><br>" +
                "<b>Kaugused teatritest:</b><br>";


            // Arvutame kauguse iga teatrini
            for (let teater of teatridAndmed) {

                let teatriAsukoht = L.latLng(
                    Number(teater.laiuskraad),
                    Number(teater.pikkuskraad)
                );

                let kaugus =
                    e.latlng.distanceTo(teatriAsukoht);

                // meetrid → kilomeetrid
                let kaugusKm =
                    (kaugus / 1000).toFixed(2);


                tekst +=
                    teater.teater +
                    ": " +
                    kaugusKm +
                    " km<br>";
            }


            // Lisame kasutaja valitud asukoha kaardile
            kasutajaMarker = L.marker(e.latlng)
                .addTo(kaart)
                .bindPopup(tekst)
                .openPopup();

        });

    </script>

</body>

</html>
