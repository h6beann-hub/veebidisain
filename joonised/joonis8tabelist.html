
<!doctype html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Ilmaennustuse lumememmed</title>

  <script>
    let g;

    // Algsed näidisandmed
    let ilmaandmed = [
      ["11.10", 3, 8, 12],
      ["12.10", 9, 8, 12]
    ];

    // Lumememme joonistamine ilmaandmete põhjal
    function lumememm(x, y, temp, tuul, puhang, kuupaev) {
      let r1 = temp * 8;
      let r2 = tuul * 4;
      let r3 = puhang * 1;

      // Alumine pall - temperatuur
      g.beginPath();
      g.arc(x, y, r1, 0, 2 * Math.PI);
      g.stroke();

      // Kuupäev
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.font = "14px Arial";
      g.fillStyle = "black";
      g.fillText(kuupaev, x, y);

      // Keskmine pall - tuule kiirus
      let y2 = y - r1 - r2;
      g.beginPath();
      g.arc(x, y2, r2, 0, 2 * Math.PI);
      g.stroke();

      // Ülemine pall - puhangukiirus
      let y3 = y2 - r2 - r3;
      g.beginPath();
      g.arc(x, y3, r3, 0, 2 * Math.PI);
      g.stroke();
    }

    // Kõigi lumememmede joonistamine
    function joonista() {
      const tahvel = document.getElementById("tahvel");
      g = tahvel.getContext("2d");

      g.clearRect(0, 0, tahvel.width, tahvel.height);

      for (let i = 0; i < ilmaandmed.length; i++) {
        let d = ilmaandmed[i];

        let x = 105 + i * 155;
        let y = 260;

        lumememm(x, y, d[1], d[2], d[3], d[0]);
      }
    }

    // Sinu Google Apps Scripti aadress
    const API_URL =
      "https://script.google.com/macros/s/AKfycbyFV3Fxu9psQREozFKkmJDh_d5fLdK9wlxEN3SwLHslz0_ZWeeB9ElyMy0CR-4KLRfEJw/exec";

    // Google Sheetsist andmete laadimine
    function uuendaAndmed() {
      document.getElementById("teade").textContent =
        "Laadin Google Sheetsi andmeid...";

      fetch(API_URL, { cache: "no-store" })
        .then(vastus => {
          if (!vastus.ok) {
            throw new Error("Andmete laadimine ebaõnnestus");
          }
          return vastus.json();
        })
        .then(andmed => {
          if (!Array.isArray(andmed)) {
            throw new Error("Andmete vorming on vale");
          }

          let uuedAndmed = andmed
            .filter(rida => Array.isArray(rida) && rida.length >= 4)
            .map(rida => [
              String(rida[0]),
              Number(rida[1]),
              Number(rida[2]),
              Number(rida[3])
            ])
            .filter(rida =>
              rida.slice(1).every(Number.isFinite)
            );

          if (uuedAndmed.length === 0) {
            throw new Error("Sobivaid ilmaandmeid ei leitud");
          }

          ilmaandmed = uuedAndmed;
          joonista();

          document.getElementById("teade").textContent =
            "Andmed edukalt uuendatud!";
        })
        .catch(viga => {
          console.error(viga);
          document.getElementById("teade").textContent =
            "Andmete laadimine ebaõnnestus. Vaata brauseri konsooli.";
        });
    }
  </script>
</head>

<body onload="joonista()">

  <h1>Ilmaennustuse lumememmed</h1>

  <p>
    Alumine pall = temperatuur |
    Keskmine pall = tuule kiirus |
    Ülemine pall = puhangukiirus
  </p>

  <canvas id="tahvel" width="900" height="340"></canvas>

  <p>
    <button onclick="uuendaAndmed()">
      Uuenda Google Sheetsist
    </button>
  </p>

  <p id="teade"></p>

</body>
</html>
