<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Küberfeminismi kalkulaator</title>

    <style>

        body {
            background-color: #0a0a0a;
            color: #0066ff;
            font-family: "Courier New", monospace;
            margin: 50px;
            max-width: 800px;
        }

        body::before {
            content: "✦ CYBERFEMINIST NETWORK // EST. 2026 ✦";
            display: block;
            color: #bdbdbd;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            text-transform: uppercase;
            border-bottom: 3px solid #0066ff;
            padding-bottom: 15px;
            letter-spacing: -2px;
        }

        h1::after {
            content: " ♀";
            color: #ff4fc8;
            font-size: 24px;
            vertical-align: top;
        }

        p {
            color: #eeeeee;
            font-size: 18px;
            line-height: 1.6;
        }

        .prompt {
            color: #ff4fc8;
            font-weight: bold;
        }

        input[type="number"] {
            background-color: #0a0a0a;
            color: #0066ff;
            border: 2px solid #0066ff;
            padding: 10px;
            font-family: "Courier New", monospace;
            font-size: 18px;
            margin-top: 8px;
            width: 220px;
        }

        input[type="button"] {
            background-color: #0066ff;
            color: #000000;
            border: 2px solid #0066ff;
            padding: 12px 20px;
            font-family: "Courier New", monospace;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 5px 5px 0 #bdbdbd;
        }

        input[type="button"]:hover {
            background-color: #ff4fc8;
            border-color: #ff4fc8;
            color: #000000;
        }

        input[type="button"]:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 #bdbdbd;
        }

        #vastus {
            color: #ff4fc8;
            margin-top: 30px;
        }

        #vastus:not(:empty) {
            padding: 20px;
            border: 2px solid #ff4fc8;
        }

        a {
            color: #0066ff;
        }

        a:hover {
            color: #ff4fc8;
        }

        hr {
            border: none;
            border-top: 1px solid #0066ff;
            margin-top: 40px;
        }

    </style>

    <script>

        function arvuta() {

            let tunnid = Number(document.getElementById("tunnid").value);
            let platvormid = Number(document.getElementById("platvormid").value);

            let tulemus = 30 + (tunnid * 5) + (platvormid * 4);

            if (tulemus > 100) {
                tulemus = 100;
            }

            let teade = "";

            if (tulemus <= 30) {
                teade = "SYSTEM OFFLINE. REVOLUTION NOT FOUND.";
            }
            else if (tulemus <= 50) {
                teade = "CONSCIOUSNESS.EXE IS BOOTING...";
            }
            else if (tulemus <= 70) {
                teade = "ALGORITHM RESISTANCE DETECTED.";
            }
            else if (tulemus <= 89) {
                teade = "PATRIARCHY.EXE HAS STOPPED WORKING.";
            }
            else {
                teade = "CYBERFEMINIST REVOLUTION ACTIVATED.";
            }

            document.getElementById("vastus").innerHTML =
                "Sinu küberfeminismi tase on " + tulemus + "%<br><br>" + teade;
        }

    </script>

</head>

<body>

    <h1>Küberfeminismi kalkulaator_</h1>

    <p>
        sest ilmselgelt saab feminismi mõõta protsentides.
    </p>

    <p>
        <span class="prompt">></span>
        mitu tundi päevas veedad substackis?
        <br>
        <input type="number" id="tunnid">
    </p>

    <p>
        <span class="prompt">></span>
        mitu raamatut sa sellel aastal lugenud oled?
        <br>
        <input type="number" id="platvormid">
    </p>

    <input type="button" value="ANALÜÜSI MIND" onclick="arvuta()">

    <h2 id="vastus"></h2>

    <hr>

    <p>
        <a href="index.html">← tagasi sisukorda</a>
    </p>

</body>

</html>
